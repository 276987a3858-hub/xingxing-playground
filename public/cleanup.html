<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据整理 · 星星与用户的房间</title>
<style>
  :root{
    --bg:#12101a; --panel:#1b1826; --panel2:#221e30; --line:#332c46;
    --text:#e8e3f2; --muted:#9d94b3; --accent:#c7a7f5; --danger:#e2685f;
    --warn:#e8b25c; --ok:#75c39a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6;
  }
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:19px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:600}
  .banner{border-left:3px solid var(--warn);background:rgba(232,178,92,.08);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#e7d4b4;margin-bottom:14px}
  .banner b{color:var(--warn)}
  .dbstat{display:flex;flex-wrap:wrap;gap:8px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
  .pill b{color:var(--text);font-weight:600}
  .pill.bad{border-color:rgba(226,104,95,.5);color:var(--danger)}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tab{
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;
  }
  .tab.on{background:rgba(199,167,245,.16);border-color:var(--accent);color:#f2ecff}
  .tab .n{opacity:.65;margin-left:4px;font-size:11.5px}
  .tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  input[type=search]{
    flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;
  }
  .row{
    display:flex;gap:10px;align-items:flex-start;
    border-bottom:1px solid rgba(51,44,70,.7);padding:10px 2px;
  }
  .row:last-child{border-bottom:none}
  .row .body{flex:1;min-width:0}
  .row .meta{font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .row .txt{font-size:13px;word-break:break-word;white-space:pre-wrap;max-height:4.8em;overflow:hidden}
  .row .tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tag.img{border-color:rgba(199,167,245,.5);color:var(--accent)}
  .tag.aud{border-color:rgba(117,195,154,.45);color:var(--ok)}
  .tag.sil{border-color:rgba(232,178,92,.45);color:var(--warn)}
  .del{
    background:transparent;border:1px solid rgba(226,104,95,.55);color:var(--danger);
    border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap;
  }
  .del:hover{background:rgba(226,104,95,.12)}
  .empty{color:var(--muted);font-size:12.5px;padding:16px 2px}
  .more{width:100%;margin-top:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px;cursor:pointer;font-size:12.5px}
  .log{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;max-height:140px;overflow:auto}
  .log div{padding:2px 0;border-bottom:1px dashed rgba(51,44,70,.6)}
  .log .ok{color:var(--ok)}
  .log .err{color:var(--danger)}
  /* 二次确认遮罩 */
  .mask{position:fixed;inset:0;background:rgba(8,6,14,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .mask.on{display:flex}
  .dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:18px;max-height:86vh;overflow:auto}
  .dlg h3{margin:0 0 10px;font-size:15px}
  .dlg .quote{background:var(--panel2);border-radius:9px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto;margin-bottom:12px}
  .dlg .note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .dlg .warnbox{font-size:12.5px;color:#f0c9a8;background:rgba(226,104,95,.1);border-left:3px solid var(--danger);border-radius:7px;padding:9px 11px;margin:10px 0}
  .dlg .relbox{font-size:12.5px;color:#cfc6e4;background:rgba(199,167,245,.09);border-left:3px solid var(--accent);border-radius:7px;padding:9px 11px;margin:10px 0}
  .dlg .btns{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}
  .btn{border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  .btn.danger{background:rgba(226,104,95,.9);border-color:transparent;color:#fff;font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--danger);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧹 数据整理（临时工具）</h1>
  <p class="sub">逐条检查并删除测试记录 · 只在本地浏览器内操作 · 不联网、不调用 AI</p>

  <div class="banner">
    <b>注意：</b>这里只删除你亲手点选的那一条记录，不会清空、不会批量、不会顺手删别的东西。
    删除前会弹出确认卡片，显示摘要与关联记录。关掉本页即退出，不写任何设置。
    <br>删除完成后请回到房间页面按 F5 刷新，否则聊天页仍显示删除前的列表。
  </div>

  <div class="card">
    <h2>本地数据概况</h2>
    <div class="dbstat" id="dbStat"><span class="pill">正在读取…</span></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="tools">
      <input type="search" id="q" placeholder="搜索内容 / 标题 / 日期，例如 测试">
      <button class="btn" id="reload">刷新</button>
    </div>
    <div id="list"><div class="empty">选择上面的分类开始检查。</div></div>
  </div>

  <div class="card">
    <h2>本次操作记录（仅本页显示，不保存）</h2>
    <div class="log" id="log"><div style="border:none">还没有删除任何记录。</div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle">确认删除这条记录？</h3>
    <div class="quote" id="dlgQuote"></div>
    <p class="note" id="dlgMeta"></p>
    <div class="relbox" id="dlgRel" hidden></div>
    <div class="warnbox" id="dlgWarn" hidden></div>
    <p class="err" id="dlgErr" hidden></p>
    <div class="btns">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn danger" id="dlgOk">确认删除</button>
    </div>
  </div>
</div>

<script src="/cleanup.js"></script>
</body>
</html>
